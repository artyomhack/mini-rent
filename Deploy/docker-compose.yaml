services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-rent-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATASOURCE_DB}
      POSTGRES_USER: ${DATASOURCE_USER}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_rent -d mini_rent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: